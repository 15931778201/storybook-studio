<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>五子棋游戏</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f5deb3, #d2b48c);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: rgba(255,255,255,0.92);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
    }
    h1 { margin-top: 0; }
    .toolbar {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }
    button {
      border: none;
      background: #8b4513;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: #a0522d; }
    .status {
      font-size: 16px;
      font-weight: bold;
      color: #333;
      margin-bottom: 12px;
    }
    canvas {
      background: #deb887;
      border: 4px solid #8b5a2b;
      border-radius: 8px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.15);
      max-width: 100%;
      height: auto;
      touch-action: none;
    }
    .hint {
      margin-top: 10px;
      color: #555;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>五子棋</h1>
    <div class="toolbar">
      <button id="restartBtn">重新开始</button>
    </div>
    <div class="status" id="status">当前回合：黑子</div>
    <canvas id="board" width="600" height="600"></canvas>
    <div class="hint">规则：黑白双方轮流落子，先连成五子者获胜。</div>
  </div>

  <script>
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const restartBtn = document.getElementById('restartBtn');

    const boardSize = 15;
    const padding = 30;
    const cellSize = (canvas.width - padding * 2) / (boardSize - 1);

    let board = [];
    let currentPlayer = 1; // 1 黑子, 2 白子
    let gameOver = false;

    function initBoard() {
      board = Array.from({ length: boardSize }, () => Array(boardSize).fill(0));
      currentPlayer = 1;
      gameOver = false;
      updateStatus();
      drawBoard();
    }

    function updateStatus(message) {
      if (message) {
        statusEl.textContent = message;
      } else if (gameOver) {
        statusEl.textContent = '游戏结束';
      } else {
        statusEl.textContent = `当前回合：${currentPlayer === 1 ? '黑子' : '白子'}`;
      }
    }

    function drawBoard() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < boardSize; i++) {
        const pos = padding + i * cellSize;
        ctx.beginPath();
        ctx.moveTo(padding, pos);
        ctx.lineTo(canvas.width - padding, pos);
        ctx.strokeStyle = '#5c3a21';
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(pos, padding);
        ctx.lineTo(pos, canvas.height - padding);
        ctx.stroke();
      }

      const stars = [3, 7, 11];
      for (const x of stars) {
        for (const y of stars) {
          drawStar(x, y);
        }
      }

      for (let row = 0; row < boardSize; row++) {
        for (let col = 0; col < boardSize; col++) {
          if (board[row][col] !== 0) {
            drawPiece(row, col, board[row][col]);
          }
        }
      }
    }

    function drawStar(row, col) {
      const x = padding + col * cellSize;
      const y = padding + row * cellSize;
      ctx.beginPath();
      ctx.arc(x, y, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#5c3a21';
      ctx.fill();
    }

    function drawPiece(row, col, player) {
      const x = padding + col * cellSize;
      const y = padding + row * cellSize;
      const radius = cellSize * 0.38;

      const gradient = ctx.createRadialGradient(x - radius / 3, y - radius / 3, radius * 0.2, x, y, radius);
      if (player === 1) {
        gradient.addColorStop(0, '#666');
        gradient.addColorStop(1, '#000');
      } else {
        gradient.addColorStop(0, '#fff');
        gradient.addColorStop(1, '#d9d9d9');
      }

      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fillStyle = gradient;
      ctx.fill();
      ctx.strokeStyle = player === 1 ? '#111' : '#aaa';
      ctx.stroke();
    }

    function getBoardPosition(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = (clientX - rect.left) * scaleX;
      const y = (clientY - rect.top) * scaleY;

      const col = Math.round((x - padding) / cellSize);
      const row = Math.round((y - padding) / cellSize);

      if (row < 0 || row >= boardSize || col < 0 || col >= boardSize) {
        return null;
      }

      const centerX = padding + col * cellSize;
      const centerY = padding + row * cellSize;
      if (Math.abs(x - centerX) > cellSize / 2 || Math.abs(y - centerY) > cellSize / 2) {
        return null;
      }

      return { row, col };
    }

    function checkWin(row, col, player) {
      const directions = [
        [1, 0],
        [0, 1],
        [1, 1],
        [1, -1]
      ];

      for (const [dx, dy] of directions) {
        let count = 1;
        count += countDirection(row, col, dx, dy, player);
        count += countDirection(row, col, -dx, -dy, player);
        if (count >= 5) return true;
      }
      return false;
    }

    function countDirection(row, col, dx, dy, player) {
      let count = 0;
      let r = row + dx;
      let c = col + dy;
      while (r >= 0 && r < boardSize && c >= 0 && c < boardSize && board[r][c] === player) {
        count++;
        r += dx;
        c += dy;
      }
      return count;
    }

    function handleMove(clientX, clientY) {
      if (gameOver) return;
      const pos = getBoardPosition(clientX, clientY);
      if (!pos) return;
      const { row, col } = pos;
      if (board[row][col] !== 0) return;

      board[row][col] = currentPlayer;
      drawBoard();

      if (checkWin(row, col, currentPlayer)) {
        gameOver = true;
        updateStatus(`${currentPlayer === 1 ? '黑子' : '白子'}获胜！`);
        return;
      }

      const isDraw = board.every(r => r.every(cell => cell !== 0));
      if (isDraw) {
        gameOver = true;
        updateStatus('平局！');
        return;
      }

      currentPlayer = currentPlayer === 1 ? 2 : 1;
      updateStatus();
    }

    canvas.addEventListener('click', (e) => {
      handleMove(e.clientX, e.clientY);
    });

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      if (touch) {
        handleMove(touch.clientX, touch.clientY);
      }
    }, { passive: false });

    restartBtn.addEventListener('click', initBoard);

    initBoard();
  </script>
</body>
</html>
